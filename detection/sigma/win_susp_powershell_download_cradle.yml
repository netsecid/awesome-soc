title: Suspicious PowerShell Download Cradle
id: 3b6a8e3b-7d4a-4e5f-9c1a-2b6e8f0d3a5c
status: experimental
description: Detects PowerShell download cradles commonly used to download and execute remote payloads, including System.Net.WebClient and DownloadString usage.
author: netsecid
date: 2026-08-07
logsource:
  category: process_creation
  product: windows
detection:
  selection_process:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_cmd:
    CommandLine|contains:
      - 'Net.WebClient'
      - 'Net.WebClient).DownloadString'
      - '(New-Object Net.WebClient)'
      - 'System.Net.WebClient'
      - 'DownloadString('
      - 'DownloadFile('
      - 'Invoke-WebRequest'
      - 'Invoke-RestMethod'
      - 'IEX '
      - 'Invoke-Expression'
      - 'Start-Process'
      - '-EncodedCommand'
      - '-enc '
  filter_bypass:
    CommandLine|contains:
      - '-Exec Bypass'
      - '-ExecutionPolicy Bypass'
      - '-ep bypass'
      - ' -w hidden'
      - '-WindowStyle Hidden'
  condition: selection_process and selection_cmd and not filter_bypass
falsepositives:
  - Legitimate administrative scripts using WebClient for approved software deployment
  - Package managers and automated update mechanisms
  - Developer tooling that downloads modules or dependencies
level: high
tags:
  - attack.execution
  - attack.t1059.001
