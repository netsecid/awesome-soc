title: RDP Brute Force Attack Detected
id: 7e2c4a8d-1f5b-4d9e-a3c7-6e8f0b2d4a9c
status: experimental
description: Detects potential RDP brute force attacks by monitoring Windows Security Event ID 4625 for LogonType 10 (Remote Interactive) and counting failures per target user within a short time window.
author: netsecid
date: 2026-08-07
logsource:
  product: windows
  service: security
  definition: 'Successful/Failed logon events'
detection:
  selection:
    EventID: 4625
    LogonType: 10
  timeframe: 5m
  condition: selection | count() by TargetUserName > 10
falsepositives:
  - Legitimate users with forgotten passwords repeatedly typing incorrect credentials
  - Automated scripts or monitoring tools that authenticate incorrectly in a loop
  - Terminal servers with high user churn where logon failures are expected; tune threshold accordingly
level: high
tags:
  - attack.credential_access
  - attack.t1110.001
  - attack.t1110.003
